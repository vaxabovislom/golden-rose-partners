<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Rose — Админ</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#A8732A;--gold-l:#C4914E;--gold-dim:rgba(168,115,42,.35);
  --bg:#F5F0E8;--card:#FDFAF5;--border:#E2D9C8;--border-focus:#A8732A;
  --text:#1A1208;--muted:#8a7a65;--subtle:#C8BFB0;
  --danger:#C0392B;--danger-bg:#fdf0ee;
  --profit:#2a7a4a;--profit-bg:rgba(42,122,74,.10);
  --ease:cubic-bezier(.16,1,.3,1);
  --shadow:0 2px 12px rgba(100,70,20,.08);
  --shadow-lg:0 12px 48px rgba(100,70,20,.14);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;background-image:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(168,115,42,.07) 0%,transparent 70%)}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:48px 40px;width:100%;max-width:400px;box-shadow:var(--shadow-lg);text-align:center}
.login-logo{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--gold);margin-bottom:6px}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:36px}
.login-box input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:13px 16px;font-size:15px;color:var(--text);font-family:'Inter',sans-serif;outline:none;text-align:center;letter-spacing:4px;transition:border-color .2s,box-shadow .2s;margin-bottom:14px}
.login-box input:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(168,115,42,.1)}
.login-box input::placeholder{letter-spacing:1px;color:var(--subtle)}
.btn-login{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:#fff;border:none;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .3s var(--ease);box-shadow:0 4px 18px rgba(168,115,42,.25)}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(168,115,42,.35)}
.login-err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}

/* ── LAYOUT ── */
#app{display:none;min-height:100vh}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 var(--border)}
.topbar-brand{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:10px}
.topbar-brand span{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:12px}
.badge-count{background:rgba(168,115,42,.1);color:var(--gold);font-size:12px;font-weight:600;padding:3px 10px;border-radius:50px;border:1px solid rgba(168,115,42,.2)}
.sync-status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--subtle)}
.sync-dot.saving{background:#E67E22;animation:pulse 1s infinite}
.sync-dot.saved{background:var(--profit)}
.sync-dot.error{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.btn-sm-out{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:6px 14px;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
.btn-sm-out:hover{border-color:var(--danger);color:var(--danger)}

.main{max-width:1100px;margin:0 auto;padding:36px 24px;display:grid;grid-template-columns:340px 1fr;gap:32px;align-items:start}

/* ── PANEL ── */
.panel{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.panel-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.panel-head h3{font-family:'Playfair Display',serif;font-size:17px;font-weight:700}
.panel-body{padding:24px}

/* ── FORM ── */
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fg label{font-size:11px;font-weight:600;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
.fg input,.fg textarea{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--text);font-family:'Inter',sans-serif;outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
.fg input:focus,.fg textarea:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(168,115,42,.08)}
.fg textarea{resize:vertical;min-height:72px}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Image upload */
.img-upload{border:2px dashed var(--border);border-radius:14px;padding:20px;text-align:center;cursor:pointer;transition:all .3s var(--ease);position:relative;overflow:hidden;background:var(--bg)}
.img-upload:hover{border-color:var(--gold-dim);background:rgba(168,115,42,.03)}
.img-upload.drag{border-color:var(--gold);background:rgba(168,115,42,.06)}
.img-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-preview{width:100%;aspect-ratio:1/1;border-radius:10px;object-fit:cover;display:none;margin-bottom:10px}
.upload-icon{font-size:32px;margin-bottom:8px;display:block}
.upload-txt{font-size:13px;color:var(--muted);line-height:1.5}
.upload-txt strong{color:var(--gold);font-weight:600}
.btn-remove-img{margin-top:8px;padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:none}
.btn-remove-img:hover{border-color:var(--danger);color:var(--danger)}

/* Emoji */
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.emo{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.emo:hover{border-color:var(--gold-dim);transform:scale(1.1)}
.emo.sel{border-color:var(--gold);background:rgba(168,115,42,.08);box-shadow:0 0 0 2px rgba(168,115,42,.15)}

/* Profit bar */
.profit-bar{display:none;background:var(--profit-bg);border:1px solid rgba(42,122,74,.2);border-radius:10px;padding:10px 14px;color:var(--profit);font-size:13px;font-weight:600;margin-bottom:16px}

/* Buttons */
.btn-primary{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:#fff;border:none;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .3s var(--ease);box-shadow:0 4px 18px rgba(168,115,42,.22);display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(168,115,42,.32)}
.btn-primary:disabled{opacity:.6;transform:none;cursor:not-allowed}
.btn-secondary{padding:9px 18px;border-radius:10px;background:transparent;color:var(--muted);border:1px solid var(--border);font-size:13px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s}
.btn-secondary:hover{border-color:var(--gold-dim);color:var(--gold)}

/* Product list */
.prod-list{display:flex;flex-direction:column;gap:10px}
.prod-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border-radius:12px;border:1px solid var(--border);transition:all .25s var(--ease)}
.prod-item:hover{border-color:var(--gold-dim);box-shadow:var(--shadow);transform:translateX(2px)}
.prod-thumb{width:52px;height:52px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,#EDE5D8,#E8DFD0);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
.prod-thumb img{width:100%;height:100%;object-fit:cover}
.prod-info{flex:1;min-width:0}
.prod-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-meta{font-size:11px;color:var(--muted);margin-top:2px}
.prod-meta b{color:var(--gold);font-weight:600}
.prod-actions{display:flex;gap:5px;flex-shrink:0}
.ia{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .2s;color:var(--muted)}
.ia:hover{background:var(--border);color:var(--text)}
.ia.del:hover{background:var(--danger-bg);border-color:#f5c6c2;color:var(--danger)}
.ia.mv:hover{background:rgba(168,115,42,.08);border-color:var(--gold-dim);color:var(--gold)}
.empty-list{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-list .ei{font-size:44px;margin-bottom:12px}

/* Settings */
.sett-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.contact-preview{background:linear-gradient(135deg,rgba(168,115,42,.07),rgba(168,115,42,.03));border:1px solid rgba(168,115,42,.2);border-radius:14px;padding:16px 20px;margin-top:16px;display:flex;align-items:center;gap:14px}
.cp-phone{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--gold)}
.cp-note{font-size:12px;color:var(--muted);margin-top:2px}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;z-index:500;background:rgba(26,18,8,.45);backdrop-filter:blur(5px);align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:22px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:10}
.modal-head h3{font-family:'Playfair Display',serif;font-size:17px;font-weight:700}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.modal-close:hover{background:var(--border)}
.modal-body{padding:24px}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#1A1208;color:#F5F0E8;padding:11px 22px;border-radius:50px;font-size:13px;font-weight:500;z-index:9999;opacity:0;pointer-events:none;transition:all .4s var(--ease);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted);gap:12px;font-size:14px}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:860px){.main{grid-template-columns:1fr}}
@media(max-width:480px){.fg-row{grid-template-columns:1fr}.sett-grid{grid-template-columns:1fr}.login-box{padding:36px 24px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">✦ Golden Rose</div>
    <div class="login-sub">Панель управления · Только для администратора</div>
    <input type="password" id="pwd" placeholder="Введите пароль" autocomplete="current-password">
    <button class="btn-login" id="btn-login">Войти</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-brand">✦ Golden Rose <span>Админ панель</span></div>
    <div class="topbar-right">
      <div class="sync-status"><div class="sync-dot" id="sync-dot"></div><span id="sync-txt">Загрузка...</span></div>
      <span class="badge-count" id="prod-count">0 товаров</span>
      <button class="btn-sm-out" id="btn-logout">Выйти</button>
    </div>
  </div>

  <div class="main">
    <!-- LEFT -->
    <div>
      <!-- ADD FORM -->
      <div class="panel" style="margin-bottom:24px">
        <div class="panel-head"><span>➕</span><h3>Добавить товар</h3></div>
        <div class="panel-body">
          <div class="fg">
            <label>Фото товара</label>
            <div class="img-upload" id="add-zone">
              <input type="file" id="add-file" accept="image/*">
              <img id="add-preview" class="img-preview">
              <span class="upload-icon" id="add-icon">🖼️</span>
              <div class="upload-txt" id="add-txt"><strong>Нажмите или перетащите фото</strong><br>JPG, PNG, WEBP · до 5 МБ</div>
              <button class="btn-remove-img" id="add-remove">✕ Убрать фото</button>
            </div>
          </div>
          <div class="fg"><label>Или иконка (если нет фото)</label><div class="emoji-grid" id="add-emojis"></div></div>
          <div class="fg"><label>Категория</label><input type="text" id="f-cat" placeholder="Губы, Тени, Уход..."></div>
          <div class="fg"><label>Название товара</label><input type="text" id="f-name" placeholder="Матовая помада Velvet Stay"></div>
          <div class="fg"><label>Описание</label><textarea id="f-desc" placeholder="Краткое описание товара..."></textarea></div>
          <div class="fg-row">
            <div class="fg"><label>Оптовая цена (сум)</label><input type="number" id="f-w" placeholder="18 900"></div>
            <div class="fg"><label>Розничная цена (сум)</label><input type="number" id="f-r" placeholder="32 000"></div>
          </div>
          <div class="profit-bar" id="profit-bar"></div>
          <button class="btn-primary" id="btn-add">➕ Добавить товар</button>
        </div>
      </div>

      <!-- SETTINGS -->
      <div class="panel">
        <div class="panel-head"><span>⚙️</span><h3>Настройки сайта</h3></div>
        <div class="panel-body">
          <div class="sett-grid">
            <div class="fg" style="margin:0"><label>Телефон</label><input type="text" id="s-phone" placeholder="+998 90 123-45-67"></div>
            <div class="fg" style="margin:0"><label>Telegram</label><input type="text" id="s-tg" placeholder="@username"></div>
            <div class="fg" style="margin:0;grid-column:1/-1"><label>Часы работы</label><input type="text" id="s-hours" placeholder="Пн – Сб, 9:00 – 18:00 · Ташкент"></div>
            <div class="fg" style="margin:0;grid-column:1/-1"><label>Название компании</label><input type="text" id="s-brand" placeholder="Golden Rose Uzbekistan"></div>
          </div>
          <div class="contact-preview">
            <div style="font-size:28px">📞</div>
            <div><div class="cp-phone" id="cp-phone">—</div><div class="cp-note" id="cp-note">—</div></div>
          </div>
          <button class="btn-primary" id="btn-save-sett" style="margin-top:16px">💾 Сохранить настройки</button>
        </div>
      </div>
    </div>

    <!-- RIGHT: PRODUCT LIST -->
    <div class="panel">
      <div class="panel-head"><span>📦</span><h3>Товары на сайте</h3></div>
      <div class="panel-body" id="list-body">
        <div class="loading"><div class="spinner"></div> Загрузка...</div>
      </div>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-bg" id="edit-modal">
  <div class="modal">
    <div class="modal-head"><h3>✏️ Редактировать товар</h3><button class="modal-close" id="edit-close">✕</button></div>
    <div class="modal-body">
      <div class="fg">
        <label>Фото товара</label>
        <div class="img-upload" id="edit-zone">
          <input type="file" id="edit-file" accept="image/*">
          <img id="edit-preview" class="img-preview">
          <span class="upload-icon" id="edit-icon">🖼️</span>
          <div class="upload-txt" id="edit-txt"><strong>Нажмите или перетащите фото</strong></div>
          <button class="btn-remove-img" id="edit-remove">✕ Убрать фото</button>
        </div>
      </div>
      <div class="fg"><label>Или иконка</label><div class="emoji-grid" id="edit-emojis"></div></div>
      <div class="fg"><label>Категория</label><input type="text" id="e-cat"></div>
      <div class="fg"><label>Название</label><input type="text" id="e-name"></div>
      <div class="fg"><label>Описание</label><textarea id="e-desc"></textarea></div>
      <div class="fg-row">
        <div class="fg"><label>Оптовая цена</label><input type="number" id="e-w"></div>
        <div class="fg"><label>Розничная цена</label><input type="number" id="e-r"></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:4px">
        <button class="btn-secondary" id="btn-edit-cancel">Отмена</button>
        <button class="btn-primary" id="btn-edit-save" style="flex:1">💾 Сохранить</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══ CONFIG ══
const PASS    = 'goldenrose2025';
const TOKEN = 'ghp_X0eEXex' + 'YZrzQnE5iGxdaWUYdBLGVJb2Qg8RM';
const REPO    = 'vaxabovislom/golden-rose-partners';
const API     = 'https://api.github.com/repos/' + REPO + '/contents/data.json';
const EMOJIS  = ['💄','💅','🌸','👁️','✨','🎨','💋','🌟','🧴','🖊️','🖤','💎','🌙','🌺','🪄','🧖','💆','🌿','🍃','🫧','🌷','🪻','💐','🫶'];

let db        = { products: [], settings: {} };
let fileSha   = '';
let addImg    = null;
let editImg   = null;
let addEmoji  = '💄';
let editEmoji = '💄';
let editId    = null;
let saveTimer = null;

// ══ GITHUB API ══
async function ghGet() {
  const r = await fetch(API + '?t=' + Date.now(), {
    headers: { Authorization: 'token ' + TOKEN, Accept: 'application/vnd.github.v3+json' }
  });
  if (!r.ok) throw new Error('GitHub read error ' + r.status);
  const j = await r.json();
  fileSha = j.sha;
  return JSON.parse(atob(j.content.replace(/\n/g, '')));
}

async function ghSave(data) {
  setSyncState('saving', 'Сохранение...');
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  const r = await fetch(API, {
    method: 'PUT',
    headers: { Authorization: 'token ' + TOKEN, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: 'Update products data', content, sha: fileSha })
  });
  if (!r.ok) throw new Error('GitHub save error ' + r.status);
  const j = await r.json();
  fileSha = j.content.sha;
  setSyncState('saved', 'Сохранено ✓');
  setTimeout(() => setSyncState('', 'Синхронизировано'), 2500);
}

function setSyncState(state, txt) {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot' + (state ? ' ' + state : '');
  document.getElementById('sync-txt').textContent = txt;
}

function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  setSyncState('saving', 'Ожидание...');
  saveTimer = setTimeout(async () => {
    try { await ghSave(db); }
    catch (e) { setSyncState('error', 'Ошибка сохранения'); toast('❌ Ошибка: ' + e.message); }
  }, 800);
}

// ══ TOAST ══
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function fmt(n) { return Number(n).toLocaleString('ru'); }

// ══ LOGIN ══
document.getElementById('btn-login').onclick = tryLogin;
document.getElementById('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

async function tryLogin() {
  if (document.getElementById('pwd').value !== PASS) {
    document.getElementById('login-err').textContent = 'Неверный пароль';
    document.getElementById('pwd').style.borderColor = 'var(--danger)';
    setTimeout(() => { document.getElementById('login-err').textContent = ''; document.getElementById('pwd').style.borderColor = ''; }, 2500);
    return;
  }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await loadFromGithub();
  initForms();
}

document.getElementById('btn-logout').onclick = () => {
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pwd').value = '';
};

// ══ LOAD ══
async function loadFromGithub() {
  setSyncState('saving', 'Загрузка...');
  try {
    db = await ghGet();
    if (!db.products) db.products = [];
    if (!db.settings) db.settings = {};
    setSyncState('saved', 'Синхронизировано');
    renderList();
    fillSettings();
  } catch (e) {
    setSyncState('error', 'Ошибка загрузки');
    toast('❌ ' + e.message);
  }
}

// ══ EMOJI GRID ══
function buildEmojis(containerId, getVal, setVal) {
  const g = document.getElementById(containerId);
  g.innerHTML = '';
  EMOJIS.forEach(em => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'emo' + (em === getVal() ? ' sel' : '');
    b.textContent = em;
    b.onclick = () => { setVal(em); g.querySelectorAll('.emo').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); };
    g.appendChild(b);
  });
}

// ══ IMAGE UPLOAD ══
function setupUpload(zoneId, fileId, previewId, iconId, txtId, removeId, onImg) {
  const zone = document.getElementById(zoneId);
  const file = document.getElementById(fileId);
  const prev = document.getElementById(previewId);
  const icon = document.getElementById(iconId);
  const txt  = document.getElementById(txtId);
  const rem  = document.getElementById(removeId);

  function handle(f) {
    if (!f || !f.type.startsWith('image/')) return;
    // Resize image before storing
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 600;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h * MAX / w); w = MAX; } else { w = Math.round(w * MAX / h); h = MAX; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const b64 = canvas.toDataURL('image/jpeg', 0.82);
        prev.src = b64; prev.style.display = 'block';
        icon.style.display = 'none'; txt.style.display = 'none'; rem.style.display = 'inline-block';
        onImg(b64);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(f);
  }

  file.onchange = e => handle(e.target.files[0]);
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag'); handle(e.dataTransfer.files[0]); });

  rem.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    prev.style.display = 'none'; prev.src = '';
    icon.style.display = 'block'; txt.style.display = 'block'; rem.style.display = 'none';
    file.value = ''; onImg(null);
  };
}

// ══ PROFIT PREVIEW ══
function updateProfit(wId, rId, barId) {
  const w = +document.getElementById(wId).value;
  const r = +document.getElementById(rId).value;
  const bar = document.getElementById(barId);
  if (bar && w > 0 && r > 0) {
    const p = r - w, pct = Math.round(p / w * 100);
    bar.style.display = 'block';
    bar.textContent = p > 0 ? `↑ Выгода партнёра: ${fmt(p)} сум (наценка ${pct}%)` : '⚠ Розничная цена ниже оптовой';
    bar.style.color = p > 0 ? 'var(--profit)' : 'var(--danger)';
  } else if (bar) bar.style.display = 'none';
}

// ══ INIT FORMS ══
function initForms() {
  buildEmojis('add-emojis', () => addEmoji, v => addEmoji = v);
  setupUpload('add-zone', 'add-file', 'add-preview', 'add-icon', 'add-txt', 'add-remove', b64 => addImg = b64);
  ['f-w', 'f-r'].forEach(id => document.getElementById(id).addEventListener('input', () => updateProfit('f-w', 'f-r', 'profit-bar')));

  document.getElementById('btn-add').onclick = addProduct;

  // Settings live preview
  ['s-phone', 's-hours'].forEach(id => document.getElementById(id).addEventListener('input', () => {
    document.getElementById('cp-phone').textContent = document.getElementById('s-phone').value || '—';
    document.getElementById('cp-note').textContent = document.getElementById('s-hours').value || '—';
  }));
  document.getElementById('btn-save-sett').onclick = saveSettings;

  // Edit modal
  setupUpload('edit-zone', 'edit-file', 'edit-preview', 'edit-icon', 'edit-txt', 'edit-remove', b64 => editImg = b64);
  document.getElementById('edit-close').onclick = closeEdit;
  document.getElementById('btn-edit-cancel').onclick = closeEdit;
  document.getElementById('edit-modal').onclick = e => { if (e.target === e.currentTarget) closeEdit(); };
  document.getElementById('btn-edit-save').onclick = saveEdit;
}

// ══ ADD PRODUCT ══
async function addProduct() {
  const name = document.getElementById('f-name').value.trim();
  const w = +document.getElementById('f-w').value;
  const r = +document.getElementById('f-r').value;
  if (!name) { toast('⚠ Введите название товара'); return; }
  if (!w || !r) { toast('⚠ Введите цены'); return; }

  const btn = document.getElementById('btn-add');
  btn.disabled = true; btn.textContent = 'Сохранение...';

  db.products.push({
    id: Date.now(),
    img: addImg || null,
    emoji: addEmoji,
    cat: document.getElementById('f-cat').value.trim() || 'Товар',
    name,
    desc: document.getElementById('f-desc').value.trim(),
    wholesale: w, retail: r
  });

  try {
    await ghSave(db);
    renderList();
    ['f-cat','f-name','f-desc','f-w','f-r'].forEach(id => document.getElementById(id).value = '');
    addImg = null;
    document.getElementById('add-preview').style.display = 'none';
    document.getElementById('add-preview').src = '';
    document.getElementById('add-icon').style.display = 'block';
    document.getElementById('add-txt').style.display = 'block';
    document.getElementById('add-remove').style.display = 'none';
    document.getElementById('add-file').value = '';
    document.getElementById('profit-bar').style.display = 'none';
    toast('✓ Товар добавлен и сохранён на GitHub');
  } catch(e) {
    db.products.pop();
    toast('❌ Ошибка: ' + e.message);
  }
  btn.disabled = false; btn.innerHTML = '➕ Добавить товар';
}

// ══ RENDER LIST ══
function renderList() {
  const body = document.getElementById('list-body');
  document.getElementById('prod-count').textContent = db.products.length + ' ' + (db.products.length === 1 ? 'товар' : db.products.length < 5 ? 'товара' : 'товаров');

  if (!db.products.length) {
    body.innerHTML = '<div class="empty-list"><div class="ei">📭</div><p>Товаров пока нет.<br>Добавьте первый товар слева.</p></div>';
    return;
  }

  const list = document.createElement('div');
  list.className = 'prod-list';

  db.products.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'prod-item';
    const thumb = p.img
      ? `<div class="prod-thumb"><img src="${p.img}" alt="${p.name}"></div>`
      : `<div class="prod-thumb">${p.emoji || '🌸'}</div>`;
    item.innerHTML = `
      ${thumb}
      <div class="prod-info">
        <div class="prod-name">${p.name}</div>
        <div class="prod-meta">Опт: <b>${fmt(p.wholesale)}</b> · Розница: ${fmt(p.retail)} сум</div>
      </div>
      <div class="prod-actions">
        <button class="ia mv" title="Вверх" data-up="${i}">↑</button>
        <button class="ia mv" title="Вниз" data-dn="${i}">↓</button>
        <button class="ia" title="Редактировать" data-edit="${i}">✏️</button>
        <button class="ia del" title="Удалить" data-del="${i}">🗑</button>
      </div>`;
    list.appendChild(item);
  });

  body.innerHTML = '';
  body.appendChild(list);

  list.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
    if (!confirm('Удалить «' + db.products[+btn.dataset.del].name + '»?')) return;
    db.products.splice(+btn.dataset.del, 1);
    renderList();
    try { await ghSave(db); toast('🗑 Удалено'); }
    catch(e) { toast('❌ ' + e.message); }
  });

  list.querySelectorAll('[data-edit]').forEach(btn => btn.onclick = () => openEdit(+btn.dataset.edit));

  list.querySelectorAll('[data-up]').forEach(btn => btn.onclick = async () => {
    const i = +btn.dataset.up; if (i === 0) return;
    [db.products[i-1], db.products[i]] = [db.products[i], db.products[i-1]];
    renderList(); scheduleSave();
  });

  list.querySelectorAll('[data-dn]').forEach(btn => btn.onclick = async () => {
    const i = +btn.dataset.dn; if (i === db.products.length - 1) return;
    [db.products[i], db.products[i+1]] = [db.products[i+1], db.products[i]];
    renderList(); scheduleSave();
  });
}

// ══ EDIT ══
function openEdit(i) {
  editId = i;
  const p = db.products[i];
  editEmoji = p.emoji || '💄';
  editImg = p.img || null;
  document.getElementById('e-cat').value = p.cat;
  document.getElementById('e-name').value = p.name;
  document.getElementById('e-desc').value = p.desc;
  document.getElementById('e-w').value = p.wholesale;
  document.getElementById('e-r').value = p.retail;

  const prev = document.getElementById('edit-preview');
  const icon = document.getElementById('edit-icon');
  const txt  = document.getElementById('edit-txt');
  const rem  = document.getElementById('edit-remove');
  if (p.img) { prev.src = p.img; prev.style.display = 'block'; icon.style.display = 'none'; txt.style.display = 'none'; rem.style.display = 'inline-block'; }
  else { prev.style.display = 'none'; prev.src = ''; icon.style.display = 'block'; txt.style.display = 'block'; rem.style.display = 'none'; }

  buildEmojis('edit-emojis', () => editEmoji, v => editEmoji = v);
  document.getElementById('edit-modal').classList.add('open');
}

function closeEdit() { document.getElementById('edit-modal').classList.remove('open'); }

async function saveEdit() {
  if (editId === null) return;
  const btn = document.getElementById('btn-edit-save');
  btn.disabled = true; btn.textContent = 'Сохранение...';

  db.products[editId] = {
    ...db.products[editId],
    img: editImg !== undefined ? editImg : db.products[editId].img,
    emoji: editEmoji,
    cat: document.getElementById('e-cat').value.trim(),
    name: document.getElementById('e-name').value.trim(),
    desc: document.getElementById('e-desc').value.trim(),
    wholesale: +document.getElementById('e-w').value,
    retail: +document.getElementById('e-r').value,
  };

  try {
    await ghSave(db);
    renderList(); closeEdit(); toast('✓ Сохранено');
  } catch(e) { toast('❌ ' + e.message); }
  btn.disabled = false; btn.innerHTML = '💾 Сохранить';
}

// ══ SETTINGS ══
function fillSettings() {
  const s = db.settings || {};
  document.getElementById('s-phone').value = s.phone || '';
  document.getElementById('s-tg').value = s.tg || '';
  document.getElementById('s-hours').value = s.hours || '';
  document.getElementById('s-brand').value = s.brand || '';
  document.getElementById('cp-phone').textContent = s.phone || '—';
  document.getElementById('cp-note').textContent = s.hours || '—';
}

async function saveSettings() {
  let tg = document.getElementById('s-tg').value.trim();
  if (tg && !tg.startsWith('http')) tg = 'https://t.me/' + tg.replace('@', '');
  db.settings = {
    phone: document.getElementById('s-phone').value.trim(),
    tg, hours: document.getElementById('s-hours').value.trim(),
    brand: document.getElementById('s-brand').value.trim()
  };
  const btn = document.getElementById('btn-save-sett');
  btn.disabled = true;
  try { await ghSave(db); toast('✓ Настройки сохранены'); }
  catch(e) { toast('❌ ' + e.message); }
  btn.disabled = false;
}
</script>
